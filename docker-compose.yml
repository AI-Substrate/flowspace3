# The fs3 stack (PRD req 33). Phase 1 composes Postgres+pgvector only; the
# daemon runs on the host against it and moves into this file in a later plan.
#
#   docker compose up -d        # start
#   docker compose ps           # what is running
#   docker compose down         # stop, keep data
#   docker compose down -v      # stop, delete the volume
#
# Host port 5433, deliberately off 5432 so a machine-local Postgres is never
# shadowed and never accidentally migrated.

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: flowspace3-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: flowspace3
      POSTGRES_PASSWORD: flowspace3
      POSTGRES_DB: flowspace3
    # Row 140 (2026-09-02, measured in scratch/db-cpu-profile): the defaults
    # (128MB shared_buffers, 4MB work_mem, 1GB max_wal_size) turned the 16k
    # buffer pool over every 5s and pinned WAL at the ceiling. These values are
    # ALSO applied via ALTER SYSTEM on the live volume; this block keeps a fresh
    # volume identical. pg_stat_statements is preloaded so a DB question can be
    # answered without hand-rolling a sampler.
    command:
      - postgres
      - -c
      - shared_buffers=4GB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - effective_cache_size=16GB
      - -c
      - effective_io_concurrency=200
      - -c
      - random_page_cost=1.1
      - -c
      - max_wal_size=8GB
      - -c
      - wal_compression=on
      - -c
      - track_io_timing=on
      - -c
      - shared_preload_libraries=pg_stat_statements
    ports:
      - "5433:5432"
    volumes:
      - flowspace3-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowspace3 -d flowspace3"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  # Row 124b (2026-09-02): a SEPARATE postmaster for tests. Every coder gate,
  # per-run FreshDatabase and EXPLAIN experiment used to run against the prod
  # postmaster above; concurrent CREATE/DROP and one runaway EXPLAIN crashed it
  # twice in one day (rows 124, 141, the second crash at 02:06Z). Point
  # FS3_TEST_DATABASE_URL here. Disposable: no data anyone keeps lives in it.
  db-test:
    image: pgvector/pgvector:pg16
    container_name: flowspace3-db-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: flowspace3
      POSTGRES_PASSWORD: flowspace3
      POSTGRES_DB: flowspace3_test
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - max_wal_size=4GB
      - -c
      - wal_compression=on
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - max_parallel_workers_per_gather=0
    ports:
      - "5434:5432"
    volumes:
      - flowspace3-pgdata-test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowspace3 -d flowspace3_test"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  flowspace3-pgdata-test:
  flowspace3-pgdata:
