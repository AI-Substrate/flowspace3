[project]
name = "conv-atlas"
version = "0.1.0"
description = "Extract, model and publish flowspace3 conversation snapshots for the conv-atlas app and for agent data science"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17",
  "duckdb>=1.1",
  "psycopg[binary]>=3.2",
  "jsonschema>=4.23",
  "networkx>=3.3",
  "scikit-learn>=1.5",
  "umap-learn>=0.5.7",
]

[project.scripts]
conv-atlas = "conv_atlas.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conv_atlas"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
