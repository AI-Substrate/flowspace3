[package]
name = "fs3-testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shipped fakes, contract harnesses, and the architecture drift check."

# Not a dev-only crate: `provider = "fake"` is a legal runtime config value, so
# fs3-daemon depends on this normally (workshop 001 rule 5).
[dependencies]
fs3-core.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
tokio.workspace = true

# The architecture drift check. Run by `harness checks`; its logic is also
# asserted RED against a committed drifted fixture by a normal cargo test.
[[bin]]
name = "fs3-arch-check"
path = "src/bin/arch_check.rs"
