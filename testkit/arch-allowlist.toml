# The crate graph of workshop 001, as data.
#
# This file is an ALLOW-LIST, not a deny-list: any direct dependency edge that
# is not named here is architecture drift and fails the check. Adding a
# dependency therefore costs one deliberate line — which is the point.
#
# Checked by `cargo run -p fs3-testkit --bin fs3-arch-check` (wired into
# `harness checks`). The check's own negative proof lives in
# `testkit/tests/arch_drift.rs` against `fixtures/arch/drifted-metadata.json`.
#
#   core/       domain types + pure logic + the two PORT traits. Depends on ~nothing.
#   parsers/    tree-sitter grammars -> core types. Concrete.        -> core
#   providers/  OpenAI / local impls of the ports.                   -> core
#   store/      sqlx repos, migrations, queue table. Concrete.       -> core
#   testkit/    fakes, contract harnesses. A real shipped crate.     -> core
#   daemon/     axum HTTP, workers, COMPOSITION ROOT                 -> all above
#   cli/        `flowspace3` binary - thin HTTP client of daemon.    -> core

# Refused workspace-wide (workshop 001 rule 5: fakes over mocks). Reported with
# a distinct message so a review can cite the rule by name.
banned_everywhere = [
  "mockall",
  "mockito",
  "wiremock",
  "faux",
  "double",
  "mock_derive",
  "mock-it",
  "simulacrum",
]

# ---------------------------------------------------------------------------
# Functional core (rule 2). The forbidden set here is the architecture's spine:
# no tokio, no sqlx, no HTTP client, no web framework, no parser.
[crates.fs3-core]
internal = []
external = ["async-trait", "serde", "thiserror", "toml"]

[crates.fs3-parsers]
internal = ["fs3-core"]
external = ["thiserror", "tree-sitter", "tree-sitter-md", "tree-sitter-rust"]

[crates.fs3-providers]
# fs3-testkit is a dev-edge here: the real provider runs the same contract
# harness the fake does.
internal = ["fs3-core", "fs3-testkit"]
external = ["async-trait", "reqwest", "serde", "serde_json", "tokio"]

[crates.fs3-store]
internal = ["fs3-core"]
external = ["anyhow", "sqlx", "thiserror", "tokio"]

[crates.fs3-testkit]
internal = ["fs3-core"]
external = ["async-trait", "serde", "serde_json", "thiserror", "toml", "tokio"]

# The composition root, and the only crate allowed to see everything.
[crates.fs3-daemon]
internal = ["fs3-core", "fs3-parsers", "fs3-providers", "fs3-store", "fs3-testkit"]
external = [
  "anyhow",
  "axum",
  "reqwest",
  "serde",
  "serde_json",
  "thiserror",
  "tokio",
  "toml",
  "tracing",
  "tracing-subscriber",
]

# A thin HTTP client. It shares core's types and knows nothing else.
[crates.fs3-cli]
internal = ["fs3-core"]
external = ["anyhow", "clap", "reqwest", "serde", "serde_json", "tokio", "toml"]
