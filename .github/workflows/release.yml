# Cross-platform release builds (PRD req 47, plan 004 / plan-002 substrate).
# Triggered by the semver tag that release-please pushes when its rolling PR
# merges.
#
# ONE shipped binary (req 51): `flowspace3` — built with `-p fs3-cli`; the
# daemon is its `flowspace3 daemon` subcommand.
#
# Matrix:
#   linux aarch64 + x86_64 gnu — plan-002 build container (docker/scripts/build.sh)
#   darwin aarch64 + x86_64    — NATIVE on macOS runners (Apple SDK licensing
#                                forbids Darwin builds in Linux containers);
#                                per ruling 2026-08-26: built AND validated on
#                                real hardware — smoke-run (--version, help)
#                                plus the fast unkeyed test tier (everything
#                                except fs3-store, which needs the PG stack;
#                                keyed provider tests are #[ignore] by default)
#
# NOT in the matrix, with evidence: musl (aarch64+x86_64) and windows-gnu
# cannot link — ort-sys ships no prebuilt ONNX runtime for those triples
# ("no prebuilt binaries available for target …", observed 2026-08-26).
# Escalated to Jordan; revisit if ort moves to load-dynamic or source builds.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  FS3_ENGINE: docker

jobs:
  container-builds:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      # The arm64 container instance runs under emulation on the x86_64
      # runner; release-only, so the slower build is acceptable.
      - name: Set up QEMU
        if: startsWith(matrix.target, 'aarch64')
        uses: docker/setup-qemu-action@v3

      - name: Build (${{ matrix.target }})
        env:
          FS3_TARGET: ${{ matrix.target }}
        run: ./docker/scripts/build.sh

      - name: Smoke-run (${{ matrix.target }})
        if: startsWith(matrix.target, 'x86_64')
        run: |
          docker run --rm -v fs3-bin:/bins:ro debian:trixie-slim \
            /bins/${{ matrix.target }}/release/flowspace3 --version

      - name: Collect binary
        shell: bash
        run: |
          mkdir -p dist
          docker run --rm -v fs3-bin:/bins:ro -v "$PWD/dist:/out" \
            debian:bookworm-slim cp "/bins/${{ matrix.target }}/release/flowspace3" \
            "/out/flowspace3-${{ matrix.target }}"
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/

  macos-builds:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
    # Intel Macs are NOT supported (Jordan, 2026-08-26): x86_64-apple-darwin
    # was removed from the matrix; the release ships THREE binaries.

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      # Native mac build (the only legal way to produce Darwin binaries).
      - name: Build (${{ matrix.target }})
        run: |
          cargo build --locked --release --target ${{ matrix.target }} -p fs3-cli
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/flowspace3" "dist/flowspace3-${{ matrix.target }}"

      # Ruling 2026-08-26: mac targets are BUILT AND RUN — prove runtime on
      # real hardware, not just linkage.
      - name: Smoke-run (${{ matrix.target }})
        run: |
          BIN="target/${{ matrix.target }}/release/flowspace3"
          "$BIN" --version
          "$BIN" daemon --help >/dev/null
          "$BIN" doctor --help   >/dev/null

      # Ruling 2026-08-26 (mac tier scope, Jordan binding): the mac tier
      # proves the BINARY on real hardware — build, smoke, engine-independent
      # logic tests. NO docker/compose installs and NO live-engine assertions:
      # mac runners have no engine and no nested virt. crates/cli's
      # doctor_daemon.rs asserts engine-present semantics (its findings need a
      # docker binary plus `compose up`), so those tests are skipped on this
      # tier only; they stay green in the Linux CI gate where an engine exists.
      - name: Fast test tier (${{ matrix.target }})
        run: cargo test --workspace --exclude fs3-store -- --skip '^doctor_'

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/

  upload:
    needs: [container-builds, macos-builds]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify artifact shapes (file(1))
        shell: bash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq file >/dev/null
          file dist/*
          test "$(ls dist | wc -l)" -eq 3

      - name: Attach binaries to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" dist/* --clobber
          # Deferred-validation stances recorded honestly on every release:
          gh release edit "$TAG" --notes "$(gh release view "$TAG" --json body -q .body)

          ---
          **Validation stances** (plan 004):
          - Linux binaries: built in the pinned plan-002 container; x86_64 smoke-run (\`--version\`) inside the container. Runtime tiers proven by CI on Linux only.
          - macOS binaries (Apple Silicon only — **Intel Macs are not supported**, Jordan 2026-08-26): **built and run on real hardware** — smoke-run + engine-independent test tier on a macOS runner.
          - Windows binary: **not shipped yet** — ort-sys has no prebuilt ONNX runtime for windows-gnu/musl triples (observed 2026-08-26); revisit when ort supports them or moves to load-dynamic/source builds.
          - musl variants: not shipped for the same reason."
