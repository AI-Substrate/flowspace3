# CI gate (PRD req 46). Runs on PULL REQUESTS into main only (Jordan ruling
# 2026-08-27, PR-workflow cutover: main is branch-protected, all work arrives
# via PRs from worktree branches, and we do NOT build on every push). The
# gate proves the PR's merge result on Linux exactly as `harness checks` does
# locally. Linux is the only checking platform: macOS/Windows builds are
# release-only and never gated (plan 004). release-please.yml still fires on
# push to main (merges) — that is the release trigger, not this gate.
#
# The store tier needs Postgres+pgvector; the service container below mirrors
# docker-compose.yml (pgvector/pgvector:pg16, host port 5433). Tiers above
# store keep CI endpoint-free — no API keys, no network services.

name: ci

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # Shipped default database address; tests spawn the real daemon binary
  # against exactly this address.
  FS3_TEST_DATABASE_URL: postgres://flowspace3:flowspace3@127.0.0.1:5433/flowspace3
  CARGO_TERM_COLOR: always

jobs:
  gate:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: flowspace3
          POSTGRES_PASSWORD: flowspace3
          POSTGRES_DB: flowspace3
        ports:
          - 5433:5432
        # The image defines no HEALTHCHECK, so GitHub's service health probe
        # cannot be used; readiness is observed by the wait step below.

    steps:
      - uses: actions/checkout@v4

      # ddocs is not published in the reachable npm feed and has no v0.1.0
      # tag. The immutable commit is the reproducibility anchor; the version
      # assertion below is only a weaker smoke check because ddocs payloads
      # have changed before without moving 0.1.0.
      - name: Check out pinned ddocs source
        uses: actions/checkout@v4
        with:
          repository: AI-Substrate/dd
          ref: de01b77a67d0cff961e31ad8189054dd4b5c686b
          path: .ci/dd

      - name: Install pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.7.0

      - name: Install pinned ddocs
        run: |
          npm ci --prefix .ci/dd --no-audit --no-fund
          npm install --global --no-audit --no-fund ./.ci/dd
          version="$(ddocs --json version | node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync(0, "utf8")).data.version)')"
          test "$version" = "0.1.0"
          echo "ddocs $version installed from de01b77a67d0cff961e31ad8189054dd4b5c686b"

      - name: Wait for postgres
        run: |
          timeout 60 bash -c 'until printf "" >> /dev/tcp/127.0.0.1/5433; do sleep 1; done'
          echo "postgres accepting connections on 127.0.0.1:5433"

      # Installs exactly what rust-toolchain.toml pins (channel=stable,
      # rustfmt+clippy) — same toolchain the repo's own convention selects.
      # cache:false is LOAD-BEARING. setup-rust-toolchain defaults cache:true
      # and runs Swatinem/rust-cache internally as its own final step, so
      # leaving it on gives the job TWO rust-cache instances on one key. The
      # duplicate's post-step then runs `cargo metadata` after the toolchain
      # has already torn PATH down and prints
      #   Error: Unable to locate executable file: cargo
      # every single run — while still reporting outcome=success. A gate that
      # always prints an error it does not mean teaches everyone to skim the
      # log, which is how a real error gets missed.
      #
      # Found by pij-dominant-vicuna's reviewer (2026-08-31) while adopting
      # this workflow for pij-rs, and confirmed here in run 33339025078.
      # The explicit rust-cache step below is kept because it is VISIBLE:
      # caching should be a line someone can read, not a default hidden in
      # another action's action.yml.
      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - uses: Swatinem/rust-cache@v2

      # The gate no other step provides. `release.yml` builds with `--locked`,
      # so a Cargo.lock that does not match the manifests is a RELEASE-time
      # failure — discovered at a tag, on a matrix of runners, by whoever is
      # shipping. Nothing above catches it: plain `cargo test` happily updates
      # the lock in place and goes green.
      #
      # It ran first for a reason: it is two seconds, it needs no compilation,
      # and a stale lock makes every later step's result a statement about a
      # dependency set that will not be the one released.
      #
      # Found the hard way — the w-auto-update packet added `sha2` and
      # `tempfile` to fs3-daemon, went green through the whole gate, and landed
      # on main with the lock un-updated (2026-08-27).
      - name: lockfile is current
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      - name: arch drift
        run: cargo run --quiet -p fs3-testkit --bin fs3-arch-check
