[package]
name = "fs3-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The flowspace3 command-line client."

[dependencies]
fs3-core.workspace = true
# `flowspace3 doctor` ONLY. Ruled by o-prime 2026-08-26: PRD req 20's
# single-writer rule governs the DATA plane, and doctor's writes are CONTROL
# plane - create the database, apply migrations - bootstrap operations that
# logically precede a daemon existing. It is also the verb you reach for when
# the daemon is DOWN, so it cannot be a client of an endpoint that is not
# listening. Every other verb stays a thin HTTP client and never opens a pool.
fs3-store.workspace = true

anyhow.workspace = true
clap.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true

# The binary is `flowspace3` (PRD req 28), not the package name.
[[bin]]
name = "flowspace3"
path = "src/main.rs"
