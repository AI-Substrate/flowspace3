[package]
name = "fs3-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The flowspace3 command-line client."

[dependencies]
fs3-core.workspace = true
# `flowspace3 doctor` ONLY. Ruled by o-prime 2026-08-26: PRD req 20's
# single-writer rule governs the DATA plane, and doctor's writes are CONTROL
# plane - create the database, apply migrations - bootstrap operations that
# logically precede a daemon existing. It is also the verb you reach for when
# the daemon is DOWN, so it cannot be a client of an endpoint that is not
# listening. Every other verb stays a thin HTTP client and never opens a pool.
fs3-store.workspace = true
# PRD req 51 (Jordan, 2026-08-26): the daemon ships INSIDE this binary as
# `flowspace3 daemon`. One file to install, one version, and no way for a CLI
# and a daemon of different vintages to meet — req 2 made literally true. The
# composition root stays in fs3-daemon; this crate only starts it.
fs3-daemon.workspace = true

anyhow.workspace = true
clap.workspace = true
reqwest.workspace = true
# PRD req-0053: content hash of the bundled skill. Already locked through
# fs3-core, so this adds no Cargo.lock churn.
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true

# The binary is `flowspace3` (PRD req 28), not the package name.
[[bin]]
name = "flowspace3"
path = "src/main.rs"

[dev-dependencies]
# The doctor daemon-row test stands up a stub /health to probe — a fake, not a
# mock (workshop 001 rule 5).
axum.workspace = true
# DEV only: the one gate deciding which database a test may write to
# (fs3_testkit::database). It lives in testkit rather than being repeated here
# because there were THREE copies of that decision and one of them wrote to
# production — see the 2026-08-27 ruling.
fs3-testkit.workspace = true
# DEV only: the daemon log-file test needs a throwaway config directory and a
# throwaway log directory, and must never write to the user's real ones.
tempfile.workspace = true
