[package]
name = "fs3-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "fs3 domain types, pure logic, and the two port traits."

# Functional core (workshop 001 rule 2): no tokio, no sqlx, no HTTP.
# `async-trait` is object-safety scaffolding; `serde`/`serde_json`/`toml` are
# pure parsers. `serde_json` earns its place with the workshop-004 envelope:
# `data`, `meta` and `error.details` are open by contract — a verb's payload is
# whatever that verb returns — so the envelope needs a JSON value type. The
# alternative, stringly-typed details, would change the wire shape the workshop
# fixed.
[dependencies]
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
