[package]
name = "fs3-parsers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "tree-sitter grammars turned into fs3 core elements."

# Concrete by design: the parser is not a port. Adding a language is adding a
# grammar crate and one line in `Language::for_extension` - never per-language
# extraction code (PRD req 21).
[dependencies]
fs3-core.workspace = true
# `discovery` walks a real directory (the one IO in this crate, behind
# `discover(&Path, …)`); everything else here stays pure bytes-in/tree-out.
ignore.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tree-sitter.workspace = true
tree-sitter-md.workspace = true
tree-sitter-python.workspace = true
tree-sitter-rust.workspace = true

# Dev-only, and dev-only by suffix in the arch allow-list: the cross-filter
# fixture (`discovery_filter`) is shared with fs3-daemon's watcher, so both
# sides answer one table rather than two lookalike test suites.
[dev-dependencies]
fs3-testkit.workspace = true
