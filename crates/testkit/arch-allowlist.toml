# The crate graph of workshop 001, as data.
#
# This file is an ALLOW-LIST, not a deny-list: any direct dependency edge that
# is not named here is architecture drift and fails the check. Adding a
# dependency therefore costs one deliberate line — which is the point.
#
# Entries are KIND-AWARE, because the shipped/test distinction is architecture:
#
#   "serde"        may be declared in [dependencies] — and, being the more
#                  privileged table, in [dev-dependencies] as well.
#   "tokio@dev"    may be declared ONLY in [dev-dependencies]. Promoting it to
#                  [dependencies] ships it, and the check says so by name.
#   "cc@build"     may be declared ONLY in [build-dependencies].
#
# A suffix that is not `@dev` or `@build` fails the allow-list parse rather than
# being read as part of a crate name.
#
# Checked by `cargo run -p fs3-testkit --bin fs3-arch-check` (wired into
# `harness checks`). The check's own negative proof lives in
# `crates/testkit/tests/arch_drift.rs` against `fixtures/arch/drifted-metadata.json`.
#
#   crates/core/       domain types + pure logic + the two PORT traits. Depends on ~nothing.
#   crates/parsers/    tree-sitter grammars -> core types. Concrete.        -> core
#   crates/providers/  OpenAI / local impls of the ports.                   -> core
#   crates/store/      sqlx repos, migrations, queue table. Concrete.       -> core
#   crates/git/        gitoxide: repo identity + blob-keyed snapshots.      -> core
#   crates/testkit/    fakes, contract harnesses. A real shipped crate.     -> core
#   crates/daemon/     axum HTTP, workers, COMPOSITION ROOT                 -> all above
#   crates/cli/        `flowspace3` binary - thin HTTP client of daemon.    -> core

# Refused workspace-wide (workshop 001 rule 5: fakes over mocks). Reported with
# a distinct message so a review can cite the rule by name.
banned_everywhere = [
  "mockall",
  "mockito",
  "wiremock",
  "faux",
  "double",
  "mock_derive",
  "mock-it",
  "simulacrum",
]

# ---------------------------------------------------------------------------
# Functional core (rule 2). The forbidden set here is the architecture's spine:
# no tokio, no sqlx, no HTTP client, no web framework, no parser.
#
# `serde_json` is a pure value codec, not IO, and it arrived with the
# workshop-004 envelope: `data`, `meta` and `error.details` are open by
# contract — a verb's payload is whatever that verb returns — so the envelope
# needs a JSON value type. Stringly-typed details would have changed the wire
# shape the workshop fixed. This edge is a codec; it is not permission for core
# to speak HTTP.
[crates.fs3-core]
internal = []
external = ["async-trait", "serde", "serde_json", "sha2", "thiserror", "toml"]

# `ignore` is ripgrep's walker, and it is the ONE piece of IO this crate does
# (`discovery::discover`). It is here rather than in core because core performs
# no IO at all (rule 2), and it is a dependency rather than hand-rolled code
# because gitignore semantics — nested ignore files, negations, parent rules,
# force-include precedence — are a decade of edge cases fs3 has no reason to
# re-derive (PRD req 41).
#
# `fs3-testkit@dev` is the cross-filter fixture: the same `(root, path)` table
# is run through discovery's prune here and through the watcher's pre-filter in
# fs3-daemon, so the two cannot silently disagree. Dev-only by suffix — test
# data must not ship inside the parser.
[crates.fs3-parsers]
internal = ["fs3-core", "fs3-testkit@dev"]
external = [
  "ignore",
  "thiserror",
  "tree-sitter",
  "tree-sitter-md",
  "tree-sitter-python",
  "tree-sitter-rust",
]

[crates.fs3-providers]
# fs3-testkit is a DEV edge here: the real provider runs the same contract
# harness the fake does, and the fake must not ship inside the provider crate.
# The `@dev` suffix is what enforces that — it used to be this comment.
internal = ["fs3-core", "fs3-testkit@dev"]
# `azure_core` (the `TokenCredential` trait + a redacting `Secret`) and
# `azure_identity` (the Entra credential chain that reads an `az login`) are the
# Azure OpenAI adapter's real needs: hand-rolling OAuth here would be the
# reinvention this list exists to notice. `fastembed` is the local ONNX
# embedder — it owns the ORT session, tokenizer, model-specific pooling and
# normalisation, all four of which fs2 hand-rolled. `tokio` is SHIPPED here,
# and only here among the leaf crates: the local session is CPU-bound and
# blocking, so `embed` hands it to `spawn_blocking` rather than stalling an
# async worker thread. Core stays tokio-free, which is the line that matters.
# `axum@dev` serves the offline stub HTTP server the Azure tests answer from —
# a fake, and dev-only by suffix.
#
# `rusqlite` is plan 005's ONE new dependency edge, granted by the impl-guide
# for the git-ai metrics-db reader: that store is a sqlite database somebody
# else writes, so reading it is a bundled-sqlite query and the alternative is
# hand-rolling a file format. Bundled rather than system-linked, so a build
# needs no libsqlite3 on the host. It lands HERE and not in `fs3-parsers`
# because the readers are IO port impls (prime ruling SA1, 2026-08-28) and this
# is the crate that already ships blocking, world-touching adapters.
external = [
  "async-trait",
  "axum@dev",
  "azure_core",
  "azure_identity",
  "fastembed",
  "reqwest",
  "rusqlite",
  "serde",
  "serde_json",
  "tokio",
]

[crates.fs3-store]
# `fs3-testkit@dev`: the store's similarity tests need vectors whose cosine
# ordering is meaningful, and `FakeEmbedder` already is that. Dev-only by
# suffix — the fake must never ship inside the store.
internal = ["fs3-core", "fs3-testkit@dev"]
# `pgvector` is the wire codec for the `vector` column type; `serde_json` is
# the typed shape of `jobs.payload`, which is JSONB.
external = [
  "anyhow@dev",
  "pgvector",
  "serde_json",
  "sqlx",
  "thiserror",
  "tokio@dev",
]

# The git front door (PRD reqs 5, 35, 41). Concrete infrastructure, the same
# shape as fs3-store: git is a requirement, not a variable, so there is no port
# here and nothing to fake. `gix` is gitoxide — pure-Rust git plumbing, chosen
# over libgit2 because a C dependency puts a compiler between fs3 and every
# platform it builds on; hand-rolling index parsing, gitignore semantics and
# blob hashing is exactly the reinvention this list exists to notice.
# `tempfile@dev` builds the throwaway repositories the tests run real `git`
# against — dev-only by suffix.
[crates.fs3-git]
internal = ["fs3-core"]
external = ["gix", "tempfile@dev", "thiserror"]

# FreshDatabase is shared test/sandbox infrastructure. It reaches Postgres only
# through fs3-store's typed control-plane API; sqlx remains inside fs3-store.
[crates.fs3-testkit]
internal = ["fs3-core", "fs3-store"]
external = ["async-trait", "serde", "serde_json", "thiserror", "toml", "tokio@dev"]

# The composition root, and the only crate allowed to see everything. Plan 003
# added `fs3-git` and `fs3-parsers`: the indexing pipeline is wired HERE, so the
# daemon is the crate that asks git what the bytes are and asks the scanner what
# is in them. Both edges were always in workshop 001's graph; nothing used them
# until there was a pipeline to wire.
[crates.fs3-daemon]
internal = [
  "fs3-core",
  "fs3-git",
  "fs3-parsers",
  "fs3-providers",
  "fs3-store",
  "fs3-testkit",
  # DEV only: the first-light e2e proves the tk-0108 loop end to end - a behind
  # database is rejected, `flowspace3 doctor` repairs it, the same call then
  # succeeds. Proving that without calling the real doctor would mean a second
  # implementation of it inside a test, which is the drift the split refuses.
  "fs3-cli@dev",
]
external = [
  "anyhow",
  # The `Reconcile` trait is used as `dyn Reconcile` by the reconcile runner,
  # and `async fn` in a trait is not object-safe. This is the crate that makes
  # a one-method async trait dyn-able; core already carries it for the ports.
  "async-trait",
  "axum",
  # The daemon mints a fresh 256-bit bearer key at each boot. `getrandom`
  # reaches the host RNG directly, with no seed state or general PRNG surface.
  "getrandom",
  # The live file watcher (ruling 2026-08-26: the daemon is host-native BECAUSE
  # watching cannot cross a container boundary). It belongs here rather than in
  # a leaf crate because watching is wiring — the supervisor reads the
  # `worktrees` table and enqueues jobs, both of which only the composition
  # root may see.
  "notify",
  # SHIPPED since PRD req 54: the auto-updater probes `releases/latest` for the
  # redirect that names the newest tag (no GitHub API quota) and downloads the
  # asset. Updating is something the daemon DOES now, not something a test drove.
  "reqwest",
  # DEV only: the e2e asserts ROW COUNTS the typed API has no verb for
  # ("how many smart vectors exist"), which is a question about the schema
  # rather than about a flow. Shipping sqlx in the daemon stays refused.
  "sqlx@dev",
  "serde",
  "serde_json",
  # The auto-updater verifies the downloaded asset against the release's own
  # SHA256SUMS before the swap. TLS plus GitHub is not verification.
  "sha2",
  # Stages the new binary IN the install directory so the swap is a
  # same-filesystem rename (cross-filesystem is EXDEV), and so an abandoned
  # download cleans itself up rather than littering beside the binary.
  "tempfile",
  "thiserror",
  "tokio",
  # Already transitive via sqlx (Cargo.lock:4528), so this direct dependency
  # fetches no new code. ReceiverStream is Tokio's own mpsc-to-Stream adapter
  # for axum's Body::from_stream; a hand-rolled stream is more failure surface,
  # especially when a subscriber lags.
  "tokio-stream",

  "toml",
  "tracing",
  "tracing-subscriber",
]

# The `flowspace3` binary. Still a thin HTTP client for every INDEXING verb —
# add/status/scan/search open no pool and hold no state — with two named
# exceptions.
#
# `fs3-daemon`: PRD req 51 (Jordan, 2026-08-26) folds the daemon INTO this
# binary as `flowspace3 daemon`, so there is one file to install, one version,
# and no way for a CLI and a daemon of different vintages to meet. This edge
# does NOT make the CLI the composition root — fs3-daemon still is; the CLI
# calls `fs3_daemon::run()` and knows nothing else about it. The dependency
# direction still points inward, and the arch check still refuses everything
# else.
#
# `fs3-store`: `fs3-store` is here for `flowspace3 doctor` and nothing else.
# PRD req 20's single-writer rule governs the DATA plane; doctor's writes are
# CONTROL plane (create the database, apply migrations), bootstrap operations
# that logically precede a daemon existing - and doctor is precisely the verb
# you run when the daemon is DOWN, so it cannot be a client of it. Ruled by
# o-prime 2026-08-26. Every other verb still opens no pool.
[crates.fs3-cli]
# `fs3-testkit@dev` is the single gate deciding which database a test may write
# to. Dev-only by suffix, and centralised for a reason: that decision used to be
# copy-pasted into three test-support files, and one copy migrated a production
# database (ruling 2026-08-27).
internal = ["fs3-core", "fs3-daemon", "fs3-store", "fs3-testkit@dev"]
external = [
  "anyhow",
  "anstream",
  "clap",
  "comfy-table",
  "crossterm",
  "owo-colors",
  "ratatui",
  "reqwest",
  # PRD req-0053: sha256 of the bundled skill's content — pure computation, no IO.
  "sha2",
  "serde",
  "serde_json",
  "tokio",
  "textwrap",
  "toml",
  # DEV only: doctor's daemon row is probed against a stub /health server — a
  # fake, not a mock (workshop 001 rule 5).
  "axum@dev",
  # DEV only: throwaway config and log directories for the daemon log-file
  # test, so it can never write to the user's real ones.
  "tempfile@dev",
]
