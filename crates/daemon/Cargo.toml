[package]
name = "fs3-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The fs3 daemon: HTTP surface, workers, and the composition root."

[dependencies]
fs3-core.workspace = true
fs3-git.workspace = true
fs3-parsers.workspace = true
fs3-providers.workspace = true
fs3-store.workspace = true
# Not dev-only: `provider = "fake"` is a legal runtime configuration, so the
# fakes ship in this binary (workshop 001 rule 5).
fs3-testkit.workspace = true

anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
getrandom.workspace = true
# The host-native file watcher: FSEvents on macOS, inotify on Linux,
# ReadDirectoryChangesW on Windows, behind one `RecommendedWatcher`. Ruling
# 2026-08-26 (daemon-native-on-host) is why this is in-process rather than in a
# container, and `pocs/daemon-shell/LEARNINGS.md` is why it is trusted as a
# hint rather than as a ledger.
notify.workspace = true
# The auto-updater's HTTP client (PRD req 54): the quota-free `releases/latest`
# redirect probe, and the release-asset download. Promoted out of
# dev-dependencies when updating became something the daemon DOES rather than
# something a test drove.
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
# The auto-updater verifies a downloaded asset against the release's own
# SHA256SUMS before anything is renamed over anything: TLS plus GitHub is not
# verification.
sha2.workspace = true
# Stages the downloaded binary IN the install directory, so the swap is a
# same-filesystem `rename` (a cross-filesystem one is EXDEV) and an abandoned
# download cleans itself up instead of leaving litter beside the binary.
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# The e2e proof drives the REAL router over HTTP and the REAL runner against a
# throwaway database, so it needs a client, a driver, and the fs3 CLI's doctor
# (dw-0109 proves behind-db -> rejection -> doctor -> success as one loop).
fs3-cli.workspace = true
sqlx.workspace = true

# The `prodguard` gate in `harness checks`: snapshots the schema version of the
# CONFIGURED (production) database either side of `cargo test --all`, so a test
# run that writes to it fails the gate instead of being found by a user.
#
# It lives in this crate rather than in fs3-testkit beside the other two gate
# binaries because it needs to reach a database, and testkit ships no sqlx
# (arch-allowlist). Here it can ask the question through fs3-store's typed API,
# which is the same question boot asks. Release builds `-p fs3-cli`, so this
# target costs nothing at ship time.
[[bin]]
name = "fs3-migration-guard"
path = "src/bin/migration_guard.rs"

