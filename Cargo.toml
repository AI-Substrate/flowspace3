[workspace]
resolver = "3"
members = ["crates/core", "crates/parsers", "crates/providers", "crates/store", "crates/testkit", "crates/git", "crates/daemon", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/AI-Substrate/flowspace3"

# The crate graph of workshop 001. Direction is enforced mechanically by
# `cargo run -p fs3-testkit --bin fs3-arch-check` (see crates/testkit/arch-allowlist.toml).
[workspace.dependencies]
fs3-core = { path = "crates/core" }
fs3-git = { path = "crates/git" }
fs3-parsers = { path = "crates/parsers" }
fs3-providers = { path = "crates/providers" }
fs3-store = { path = "crates/store" }
fs3-testkit = { path = "crates/testkit" }

anyhow = "1"
async-trait = "0.1"
axum = "0.8"
azure_core = "1"
# `tokio` turns on the process executor `AzureCliCredential` needs to shell out
# to `az`; without it the developer-tools chain cannot see an `az login`.
azure_identity = { version = "1", features = ["tokio"] }
clap = { version = "4", features = ["derive"] }
# gitoxide: git plumbing in pure Rust — no libgit2 C dependency, so the
# cross-platform build story stays `cargo build`. Feature set is deliberately
# narrow: read an index, walk the worktree honouring ignore rules, hash blobs.
# No network, no checkout, no diff machinery.
gix = { version = "0.87", default-features = false, features = [
  "sha1",
  "index",
  "dirwalk",
  "max-performance-safe",
] }
# ripgrep's walker: gitignore semantics (tracked + untracked-but-not-ignored,
# nested ignore files, force-include overrides) are a pile of edge cases fs3
# refuses to re-derive — PRD req 41 is exactly what this crate already does.
ignore = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The one hash in fs3: element `raw_hash` (the dirtiness key) and the content
# key for a folder with no git to ask.
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring",
  "postgres",
  # `migrate!` embeds the migration files at compile time; it reads the
  # directory, never a database, so `cargo build` stays docker-free.
  "macros",
  "migrate",
] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tree-sitter = "0.26"
tree-sitter-md = "0.5"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
