[workspace]
resolver = "3"
members = ["crates/core", "crates/parsers", "crates/providers", "crates/store", "crates/testkit", "crates/git", "crates/daemon", "crates/cli"]

[workspace.package]
version = "0.4.0" # x-release-please-version
edition = "2024"
license = "MIT"
repository = "https://github.com/AI-Substrate/flowspace3"

# The crate graph of workshop 001. Direction is enforced mechanically by
# `cargo run -p fs3-testkit --bin fs3-arch-check` (see crates/testkit/arch-allowlist.toml).
[workspace.dependencies]
fs3-cli = { path = "crates/cli" }
fs3-core = { path = "crates/core" }
fs3-daemon = { path = "crates/daemon" }
fs3-git = { path = "crates/git" }
fs3-parsers = { path = "crates/parsers" }
fs3-providers = { path = "crates/providers" }
fs3-store = { path = "crates/store" }
fs3-testkit = { path = "crates/testkit" }

anyhow = "1"
async-trait = "0.1"
axum = "0.8"
azure_core = "1"
# `tokio` turns on the process executor `AzureCliCredential` needs to shell out
# to `az`; without it the developer-tools chain cannot see an `az login`.
azure_identity = { version = "1", features = ["tokio"] }
clap = { version = "4", features = ["derive"] }
# Local ONNX embeddings in-process: `fastembed` owns the ORT session, the
# tokenizer, the model-specific pooling (CLS for BGE, mean for MiniLM — getting
# that wrong is silently wrong, not an error) and the L2 normalisation. fs2
# hand-rolled all four in Python; this is the crate that already did it.
# Defaults are wrong for us twice over: `image-models` is dead weight for a text
# embedder, and native-tls contradicts the rustls choice `reqwest` makes above.
# `ort/download-binaries` fetches ONNX Runtime at BUILD time and links it
# statically — no runtime install, no dylib to ship.
fastembed = { version = "6", default-features = false, features = [
  "hf-hub-rustls-tls",
  "ort-download-binaries-rustls-tls",
] }
# gitoxide: git plumbing in pure Rust — no libgit2 C dependency, so the
# cross-platform build story stays `cargo build`. Feature set is deliberately
# narrow: read an index, walk the worktree honouring ignore rules, hash blobs.
# No network, no checkout, no diff machinery.
gix = { version = "0.87", default-features = false, features = [
  "sha1",
  "index",
  "dirwalk",
  "max-performance-safe",
] }
# OS-backed randomness for daemon bearer keys. No PRNG state, seed, or extra
# dependency tree: each daemon boot asks the operating system for 256 bits.
getrandom = "0.3"
# ripgrep's walker: gitignore semantics (tracked + untracked-but-not-ignored,
# nested ignore files, force-include overrides) are a pile of edge cases fs3
# refuses to re-derive — PRD req 41 is exactly what this crate already does.
ignore = "0.4"
# The host-native file watcher (ruling 2026-08-26: the daemon runs on the host
# precisely because watching does not survive a container boundary). One
# `RecommendedWatcher` over FSEvents / inotify / ReadDirectoryChangesW. The
# default `macos_fsevent` backend is kept rather than `macos_kqueue`, which
# needs one file descriptor per watched FILE and dies on a real tree.
notify = "8"
# pgvector's own Rust bindings: `vector(1024)` has a wire format, and sqlx has
# no idea what it is. This crate is the encode/decode for it and nothing else —
# `default-features = false` keeps the diesel/postgres/serde halves out.
pgvector = { version = "0.4", default-features = false, features = ["sqlx"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The one hash in fs3: element `raw_hash` (the dirtiness key) and the content
# key for a folder with no git to ask.
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring",
  "postgres",
  # `migrate!` embeds the migration files at compile time; it reads the
  # directory, never a database, so `cargo build` stays docker-free.
  "macros",
  "migrate",
  # `jobs.payload` is JSONB. Without this, a payload could only cross the wire
  # as a string the database casts and hopes about.
  "json",
] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tree-sitter = "0.26"
tree-sitter-md = "0.5"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
