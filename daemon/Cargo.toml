[package]
name = "fs3-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The fs3 daemon: HTTP surface, workers, and the composition root."

[dependencies]
fs3-core.workspace = true
fs3-providers.workspace = true
fs3-store.workspace = true
